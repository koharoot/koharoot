name: Save Log

on:
  push:
    branches: [main]

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Append log
        run: |
          echo "$(date) - $(cat message.txt)" >> logs.txt

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs.txt
          git commit -m "Add log"
          git push
