<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>koharoot</title>
</head>
<body>
  <h1>koharoot</h1>
  <p>ここから送信できます。</p>

  <textarea id="msg" placeholder="メッセージを入力"></textarea>
  <button id="send">送信</button>

  <script>
    document.getElementById("send").onclick = async () => {
      const text = document.getElementById("msg").value;
      localStorage.setItem("message", text);
      alert("送信内容を保存しました。GitHub Actionsが処理します。");
    };
  </script>
</body>
</html>
