<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>koharoot</title>
</head>
<body>
  <h1>koharoot</h1>
  <p>ここから送信できます。</p>

  <textarea id="msg" placeholder="メッセージを入力"></textarea>
  <button id="send">送信</button>

  <script>
    document.getElementById("send").onclick = async () => {
      const text = document.getElementById("msg").value;

      // message.txt を更新するための「push」を発生させる
      await fetch("https://api.github.com/repos/koharoot/koharoot/contents/message.txt", {
        method: "PUT",
        headers: {
          "Accept": "application/vnd.github+json",
          // トークンは絶対に書かない（GitHub Pagesでは使えない）
        },
        body: JSON.stringify({
          message: "update message",
          content: btoa(text)
        })
      });

      alert("送信しました。GitHub Actions が処理します。");
    };
  </script>
</body>
</html>
