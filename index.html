<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>koharoot</title>
</head>
<body>
  <h1>koharoot</h1>
  <p>ここから送信できます。</p>

  <textarea id="msg" placeholder="メッセージを入力"></textarea>
  <button id="send">送信</button>

  <script>
    document.getElementById("send").onclick = async () => {
      const text = document.getElementById("msg").value;

      // GitHub Actions の workflow_dispatch を呼び出す
      await fetch("https://api.github.com/repos/koharoot/koharoot/actions/workflows/log.yml/dispatches", {
        method: "POST",
        headers: {
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          ref: "main",
          inputs: {
      　　   message: text.trim()
          }
        })
      });

      alert("送信しました。GitHub Actions が処理します。");
    };
  </script>
</body>
</html>
